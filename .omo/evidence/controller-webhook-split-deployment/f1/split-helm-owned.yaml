# Source: echo-operator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: f1-echo-operator-controller
  namespace: f1-ns
  labels:
    helm.sh/chart: echo-operator-0.1.0
    app.kubernetes.io/name: echo-operator
    app.kubernetes.io/instance: f1
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: echo-operator
      app.kubernetes.io/instance: f1
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echo-operator
        app.kubernetes.io/instance: f1
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: f1-echo-operator-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "example/echo-operator:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPERATOR_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: METRICS_PORT
              value: "8080"
            - name: CONTROLLER_ENABLED
              value: "true"
            - name: WEBHOOK_ENABLED
              value: "false"
            - name: WEBHOOK_REGISTRATION_CLEANUP_ENABLED
              value: "false"
            - name: WEBHOOK_SELF_REGISTRATION_ENABLED
              value: "false"
            - name: LEADER_ELECTION_ENABLED
              value: "false"
            - name: LEADER_ELECTION_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
# Source: echo-operator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: f1-echo-operator-webhook
  namespace: f1-ns
  labels:
    helm.sh/chart: echo-operator-0.1.0
    app.kubernetes.io/name: echo-operator
    app.kubernetes.io/instance: f1
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: echo-operator
      app.kubernetes.io/instance: f1
      app.kubernetes.io/component: webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echo-operator
        app.kubernetes.io/instance: f1
        app.kubernetes.io/component: webhook
    spec:
      serviceAccountName: f1-echo-operator-webhook
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "example/echo-operator:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: webhook
              containerPort: 8443
              protocol: TCP
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPERATOR_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: METRICS_PORT
              value: "8080"
            - name: CONTROLLER_ENABLED
              value: "false"
            - name: WEBHOOK_ENABLED
              value: "true"
            - name: WEBHOOK_REGISTRATION_CLEANUP_ENABLED
              value: "true"
            - name: WEBHOOK_SELF_REGISTRATION_ENABLED
              value: "false"
            - name: WEBHOOK_PORT
              value: "8443"
            - name: WEBHOOK_SERVICE_NAME
              value: "f1-echo-operator"
            - name: WEBHOOK_SERVICE_NAMESPACE
              value: "f1-ns"
            - name: WEBHOOK_SERVICE_PORT
              value: "443"
            - name: WEBHOOK_CERT_AUTO_GENERATE
              value: "false"
            - name: WEBHOOK_CA_BUNDLE_PATH
              value: /etc/echo-operator/certs/ca.crt
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: webhook-tls
              mountPath: /etc/echo-operator/certs
              readOnly: true
      volumes:
        - name: webhook-tls
          secret:
            secretName: echo-operator-webhook-tls
