# Source: echo-operator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-operator
  namespace: default
  labels:
    helm.sh/chart: echo-operator-0.1.0
    app.kubernetes.io/name: echo-operator
    app.kubernetes.io/instance: echo-operator
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: echo-operator
      app.kubernetes.io/instance: echo-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echo-operator
        app.kubernetes.io/instance: echo-operator
    spec:
      serviceAccountName: echo-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "example/echo-operator:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: METRICS_PORT
              value: "8080"
            - name: LEADER_ELECTION_ENABLED
              value: "false"
            - name: LEADER_ELECTION_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
