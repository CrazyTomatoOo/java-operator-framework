{{- if .Values.rbac.create -}}
{{- $mode := include "echo-operator.deploymentMode" . -}}
{{- $controllerServiceAccountName := include "echo-operator.serviceAccountName" . -}}
{{- $webhookServiceAccountName := include "echo-operator.serviceAccountName" . -}}
{{- if eq $mode "split" -}}
{{- $controllerServiceAccountName = include "echo-operator.controllerServiceAccountName" . -}}
{{- $webhookServiceAccountName = include "echo-operator.webhookServiceAccountName" . -}}
{{- end -}}
{{- $watchedNamespace := include "echo-operator.watchedNamespace" . -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-controller" (include "echo-operator.fullname" .) }}
  namespace: {{ $watchedNamespace }}
  labels:
    {{- include "echo-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-controller" (include "echo-operator.fullname" .) }}
subjects:
  - kind: ServiceAccount
    name: {{ $controllerServiceAccountName }}
    namespace: {{ .Release.Namespace }}
{{- if and .Values.webhook.enabled .Values.webhook.certAutoGenerate }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-webhook-secret" (include "echo-operator.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "echo-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-webhook-secret" (include "echo-operator.fullname" .) }}
subjects:
  - kind: ServiceAccount
    name: {{ $webhookServiceAccountName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.leaderElection.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-controller-lease" (include "echo-operator.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "echo-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-controller-lease" (include "echo-operator.fullname" .) }}
subjects:
  - kind: ServiceAccount
    name: {{ $controllerServiceAccountName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
