apiVersion: "apiextensions.k8s.io/v1"
kind: "CustomResourceDefinition"
metadata:
  name: "echoresources.example.com"
spec:
  group: "example.com"
  names:
    kind: "EchoResource"
    plural: "echoresources"
    shortNames:
    - "echo"
    singular: "echoresource"
  scope: "Namespaced"
  conversion:
    strategy: Webhook
    webhook:
      conversionReviewVersions: ["v1"]
      clientConfig:
        service:
          namespace: {{ default .Release.Namespace .Values.webhook.service.namespace | quote }}
          name: {{ default (include "echo-operator.fullname" .) .Values.webhook.service.name | quote }}
          path: {{ .Values.webhook.path | quote }}
          port: {{ .Values.webhook.service.port }}
        caBundle: {{ .Values.webhook.caBundle | b64enc | quote }}
  versions:
  - name: "v1alpha2"
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              logLevel:
                default: "INFO"
                type: "string"
              message:
                type: "string"
              replicas:
                default: 1
                type: "integer"
            required:
            - "message"
            type: "object"
          status:
            properties:
              message:
                type: "string"
              phase:
                type: "string"
            type: "object"
        type: "object"
    served: true
    storage: true
    subresources:
      status: {}
  - name: "v1alpha1"
    deprecated: true
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              message:
                type: "string"
              replicas:
                default: 1
                type: "integer"
            required:
            - "message"
            type: "object"
          status:
            properties:
              message:
                type: "string"
              phase:
                type: "string"
            type: "object"
        type: "object"
    served: true
    storage: false
    subresources:
      status: {}
