{{- $mode := include "echo-operator.deploymentMode" . -}}
{{- if eq $mode "combined" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "echo-operator.webhookServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "echo-operator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{ if .Values.webhook.enabled }}
    - port: {{ .Values.webhook.service.port }}
      targetPort: webhook
      protocol: TCP
      name: webhook
    {{ end }}
  selector:
    {{- include "echo-operator.selectorLabels" . | nindent 4 }}
{{- else }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "echo-operator.controllerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "echo-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "echo-operator.componentSelectorLabels" (dict "root" . "component" "controller") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "echo-operator.webhookServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "echo-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.webhook.service.port }}
      targetPort: webhook
      protocol: TCP
      name: webhook
  selector:
    {{- include "echo-operator.componentSelectorLabels" (dict "root" . "component" "webhook") | nindent 4 }}
{{- end }}
