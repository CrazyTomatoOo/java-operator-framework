# Echo Operator configuration
# Environment variables take precedence over these properties.

# Namespace the operator watches. Defaults to "default" if not set via OPERATOR_NAMESPACE env.
# operator.namespace=default

# Port for metrics and health endpoints.
# metrics.port=8080

# Enable leader election. Disabled by default.
# leader.election.enabled=false

# Namespace where the leader election lock resource lives.
# leader.election.namespace=default

# Name of the leader election lease lock.
# leader.election.lock.name=echo-operator-lock

# Port the operator listens on for HTTPS admission and conversion webhooks. Override with WEBHOOK_PORT.
# webhook.port=8443

# Kubernetes Service port used by webhook self-registration. Override with WEBHOOK_SERVICE_PORT.
# webhook.service.port=443

# Generate webhook CA and server certificates on startup. Override with WEBHOOK_CERT_AUTO_GENERATE.
# Enabled by default; set to false to use file-based certificates.
# webhook.cert.auto-generate=true

# Directory for generated ca.crt, tls.crt, and tls.key files. Override with WEBHOOK_CERT_DIRECTORY.
# webhook.cert.directory=/tmp/echo-operator/certs

# Fallback CA bundle path used when webhook certificate auto-generation is disabled.
# The webhook server reads tls.crt and tls.key from the same directory. Override with WEBHOOK_CA_BUNDLE_PATH.
# webhook.ca.bundle.path=/etc/echo-operator/certs/ca.crt
