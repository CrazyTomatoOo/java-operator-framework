apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeting-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greeting-operator
  template:
    metadata:
      labels:
        app: greeting-operator
    spec:
      serviceAccountName: greeting-operator
      containers:
        - name: operator
          image: greeting-operator:e2e
          imagePullPolicy: Never
          env:
            - name: OPERATOR_FRAMEWORK_CONTROLLER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SERVER_SSL_CERTIFICATE
              value: /tls/tls.crt
            - name: SERVER_SSL_CERTIFICATE_PRIVATE_KEY
              value: /tls/tls.key
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
              scheme: HTTPS
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
              scheme: HTTPS
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: greeting-operator-tls
---
apiVersion: v1
kind: Service
metadata:
  name: greeting-operator
spec:
  selector:
    app: greeting-operator
  ports:
    - name: https
      port: 443
      targetPort: 8080