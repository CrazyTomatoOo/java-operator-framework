apiVersion: v1
kind: ServiceAccount
metadata:
  name: greeting-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: greeting-operator
rules:
  - apiGroups: ["greetings.example.com"]
    resources: ["greetings", "greetings/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: greeting-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: greeting-operator
subjects:
  - kind: ServiceAccount
    name: greeting-operator