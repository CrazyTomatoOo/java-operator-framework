apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: greetings.greetings.example.com
spec:
  group: greetings.example.com
  scope: Namespaced
  names:
    kind: Greeting
    singular: greeting
    plural: greetings
  # v2 serves writes under spec.text; the API server converts between the
  # two versions through the operator's conversion webhook at
  # /operator-framework/webhooks/convert/greetingconverter whenever the
  # requested version differs from the stored (v1) one.
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["message"]
              properties:
                message:
                  type: string
                style:
                  type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                phase:
                  type: string
                message:
                  type: string
    - name: v2
      served: true
      storage: false
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["text"]
              properties:
                text:
                  type: string
                style:
                  type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                phase:
                  type: string
                message:
                  type: string
  conversion:
    strategy: Webhook
    webhook:
      conversionReviewVersions: ["v1"]
      clientConfig:
        service:
          name: greeting-operator
          namespace: __NAMESPACE__
          path: /operator-framework/webhooks/convert/greetingconverter
        caBundle: __CA__