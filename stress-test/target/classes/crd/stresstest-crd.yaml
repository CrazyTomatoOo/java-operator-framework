apiVersion: "apiextensions.k8s.io/v1"
kind: "CustomResourceDefinition"
metadata:
  name: "stresstestresources.stress.example.com"
spec:
  group: "stress.example.com"
  names:
    kind: "StressTestResource"
    plural: "stresstestresources"
    shortNames:
    - "str"
    singular: "stresstestresource"
  scope: "Namespaced"
  versions:
  - name: "v1alpha1"
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: "object"
        properties:
          spec:
            type: "object"
            properties:
              seq:
                type: "integer"
                format: "int64"
              sentAtMs:
                type: "integer"
                format: "int64"
              payload:
                type: "string"
          status:
            type: "object"
            properties:
              observedSeq:
                type: "integer"
                format: "int64"
              phase:
                type: "string"
              lastReconcileMs:
                type: "integer"
                format: "int64"
    subresources:
      status: {}
